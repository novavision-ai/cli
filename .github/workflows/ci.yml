name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect test-relevant changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run_ci:
              - "novavision/**"
              - "tests/**"
              - "setup.py"
              - "pyproject.toml"
              - ".github/workflows/**"

      - name: Decide whether to run tests
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=${{ steps.filter.outputs.run_ci }}" >> "$GITHUB_OUTPUT"
          fi

  test-linux:
    name: test-linux
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CLI and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          novavision --help

      - name: Lint
        run: |
          python -m compileall -q novavision
          ruff check novavision tests

      - name: Unit tests
        run: |
          python -m pytest tests -m "not integration" \
            --cov=novavision \
            --cov-report=term \
            --cov-report=xml \
            --junitxml=unit-test-results.xml

      - name: Docker Compose integration tests
        run: python -m pytest tests -m integration -q

      - name: Seed fixture server for CLI
        run: |
          mkdir -p "$HOME/.novavision/Server/ci-server/demo"
          cp tests/fixtures/compose/docker-compose.yml "$HOME/.novavision/Server/ci-server/"
          cp tests/fixtures/compose/demo/docker-compose.yml "$HOME/.novavision/Server/ci-server/demo/"
          python - <<'PY'
          import json
          from pathlib import Path

          meta = Path.home() / ".novavision" / "servers.json"
          meta.write_text(
              json.dumps(
                  {
                      "ci-server": {
                          "name": "ci-server",
                          "workspace": "ci",
                          "host": "https://alfa.suite.novavision.ai/",
                      }
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: CLI start/stop against real Docker
        run: |
          novavision start server
          novavision start app --id demo
          novavision stop app --id demo
          novavision stop server --close-apps

      - name: CLI service enable/status/disable
        run: |
          sudo systemctl enable docker
          novavision_bin="$(command -v novavision)"
          sudo "$novavision_bin" service enable server --id ci-server
          sudo "$novavision_bin" service status server --id ci-server
          sudo "$novavision_bin" service disable server --id ci-server

      - name: Live install against NovaVision API
        env:
          NOVAVISION_USER_TOKEN: ${{ secrets.NOVAVISION_USER_TOKEN }}
          NOVAVISION_WORKSPACE: ${{ secrets.NOVAVISION_WORKSPACE || vars.NOVAVISION_WORKSPACE }}
          NOVAVISION_HOST: ${{ secrets.NOVAVISION_HOST || vars.NOVAVISION_HOST || 'alfa.suite.novavision.ai' }}
        run: |
          set -euo pipefail
          if [ -z "${NOVAVISION_USER_TOKEN:-}" ] || [ -z "${NOVAVISION_WORKSPACE:-}" ]; then
            echo "::error::NOVAVISION_USER_TOKEN or NOVAVISION_WORKSPACE is missing. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf 'y\n' | novavision install local "$NOVAVISION_USER_TOKEN" \
            --host "$NOVAVISION_HOST" \
            --workspace "$NOVAVISION_WORKSPACE"
          if ! ls "$HOME/.novavision/Server"/*/docker-compose.yml >/dev/null 2>&1; then
            echo "::error::novavision install did not create a server compose file."
            exit 1
          fi
          novavision start server
          app_id="$(python - <<'PY'
          from pathlib import Path

          root = Path.home() / ".novavision" / "Server"
          apps = [path.parent.name for path in root.glob("*/*/docker-compose.yml")]
          print(apps[0] if apps else "")
          PY
          )"
          if [ -z "$app_id" ]; then
            echo "::error::install succeeded but no app compose file was found."
            exit 1
          fi
          novavision start app --id "$app_id"
          novavision stop app --id "$app_id"
          novavision stop server --close-apps

      - name: Upload coverage and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          if-no-files-found: ignore
          path: |
            coverage.xml
            unit-test-results.xml
            ${{ github.workspace }}/.coverage
            /home/runner/.novavision/**/*.log

  test-windows:
    name: test-windows
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CLI and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          novavision --help

      - name: Lint
        run: |
          python -m compileall -q novavision
          ruff check novavision tests

      - name: Unit tests
        run: |
          python -m pytest tests -m "not integration" --tb=short -q

      - name: Docker daemon (best-effort, non-blocking)
        continue-on-error: true
        run: docker info

  test-macos:
    name: test-macos
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CLI and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          novavision --help

      - name: Lint
        run: |
          python -m compileall -q novavision
          ruff check novavision tests

      - name: Unit tests
        run: |
          python -m pytest tests -m "not integration" --tb=short -q

  build-matrix:
    name: build-matrix (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  ci:
    name: ci
    needs: [changes, test-linux, test-windows, test-macos, build-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          LINUX: ${{ needs.test-linux.result }}
          WINDOWS: ${{ needs.test-windows.result }}
          MACOS: ${{ needs.test-macos.result }}
          BUILD: ${{ needs.build-matrix.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES run_ci=$RUN_CI linux=$LINUX windows=$WINDOWS macos=$MACOS build=$BUILD"
          if [ "$CHANGES" != "success" ]; then
            exit 1
          fi
          if [ "$RUN_CI" != "true" ]; then
            echo "No test-relevant files changed; OS jobs were skipped."
            exit 0
          fi
          for result in "$LINUX" "$WINDOWS" "$MACOS" "$BUILD"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
