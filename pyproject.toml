[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a working Docker Compose daemon",
]

[tool.coverage.run]
source = ["novavision"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py38"
src = ["novavision", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
